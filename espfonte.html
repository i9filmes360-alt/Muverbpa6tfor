<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i9tv - Extractor por Código-Fonte & Player</title>
    <style>
        :root {
            --bg-color: #1E1E1E;
            --panel-bg: #2D2D2D;
            --accent-color: #00FFCC;
            --text-color: #E0E0E0;
            --border-color: #444;
            --danger-color: #FF5555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.4rem;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            background: #151515;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #FFF;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            padding: 12px 22px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        button:hover {
            opacity: 0.85;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media(max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-box h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .links-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .link-chip {
            background: #222;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent-color);
            gap: 8px;
        }

        .link-chip.active { background: #1c3a34; }

        .link-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .link-tag { color: var(--accent-color); font-weight: bold; }
        .link-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #bbb; }
        .link-actions { display: flex; gap: 4px; }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .link-chip button {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: #444;
            color: #FFF;
            width: auto;
        }

        .log-box {
            white-space: pre-wrap;
            background: #111;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            max-height: 90px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .hint {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ i9tv - Extractor por Código-Fonte & Player</h2>
        
        <div class="input-group">
            <label for="htmlInput" style="font-size: 0.9rem; color: var(--accent-color); font-weight: bold;">Cole o Código-Fonte (HTML) da Página do Vídeo:</label>
            <textarea id="htmlInput" placeholder="Cole o código HTML completo aqui (incluindo scripts e iframes se houver)..."></textarea>
            
            <button id="extractBtn">Extrair e Tocar</button>
        </div>
        <div class="hint">Modo de varredura avançada ativado: busca por extensões de mídia e URLs mascaradas em scripts.</div>

        <div class="workspace">
            <!-- Coluna da Esquerda: Links Detectados -->
            <div class="panel-box">
                <h3>Links Extraídos</h3>
                <div class="links-list" id="linksContainer">
                    <span style="color: #666; font-size: 0.85rem; text-align: center; margin-top: 20px;">Aguardando código-fonte...</span>
                </div>
            </div>

            <!-- Coluna da Direita: Player Integrado -->
            <div class="panel-box">
                <h3>Player de Teste / Reprodução</h3>
                <div class="player-container">
                    <video id="videoPlayer" controls playsinline>
                        Seu navegador não suporta reprodução de vídeo.
                    </video>
                </div>
            </div>
        </div>

        <div class="log-box" id="logBox" aria-live="polite">&gt; Status: pronto para receber o código HTML.</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
    <script>
        const MAX_LOG = 50;
        // Regex abrangente para pegar URLs completas ou camufladas em strings de script
        const MEDIA_REGEX = /https?:\/\/[^"'\s<>\\]+?\.(?:mp4|m3u8|ts|m4s|webm|ogv)(?:\?[^"'\s<>\\]*)?/gi;
        const JUNK_REGEX = /(thumb|preview|sprite|poster|trailer|[\/_.-]ads?[\/_.-])/i;

        const $ = id => document.getElementById(id);
        const logLines = [];
        let hls = null;
        let items = [];
        let currentIndex = -1;

        function log(msg) {
            logLines.push(msg);
            if (logLines.length > MAX_LOG) logLines.shift();
            const box = $('logBox');
            box.textContent = logLines.map(l => '> ' + l).join('\n');
            box.scrollTop = box.scrollHeight;
        }

        function showMessage(text, danger) {
            const c = $('linksContainer');
            c.textContent = '';
            const s = document.createElement('span');
            s.className = 'empty-msg';
            s.style.color = danger ? 'var(--danger-color)' : '#666';
            s.textContent = text;
            c.appendChild(s);
        }

        function normalize(html) {
            return html
                .replace(/\\u002F/gi, '/')
                .replace(/\\u0026/gi, '&')
                .replace(/\\\//g, '/')
                .replace(/&amp;/g, '&');
        }

        function isMedia(u) { return /\.(mp4|webm|ogv|m3u8|m4s|ts)(\?|$)/i.test(u); }

        function scanHtml(html) {
            const clean = normalize(html);
            
            // 1. Varredura textual bruta por regex em todo o código (pega scripts, variáveis, etc.)
            const foundUrls = clean.match(MEDIA_REGEX) || [];
            const media = new Set(foundUrls);

            // 2. Varredura via DOM Parser em tags específicas
            const doc = new DOMParser().parseFromString(clean, 'text/html');

            const add = raw => {
                if (raw && isMedia(raw)) media.add(raw);
            };

            doc.querySelectorAll('meta[property="og:video"], meta[property="og:video:url"], meta[property="og:video:secure_url"], meta[name="twitter:player:stream"]')
                .forEach(m => add(m.getAttribute('content')));
            doc.querySelectorAll('video, source, iframe, script').forEach(el => {
                add(el.getAttribute('src'));
                add(el.getAttribute('data-src'));
                // Se houver conteúdo textual dentro de tags script que contenham links
                if (el.tagName === 'TAGNAME' || el.textContent) {
                    const subMatches = el.textContent.match(MEDIA_REGEX);
                    if (subMatches) subMatches.forEach(m => media.add(m));
                }
            });

            return { media };
        }

        function buildItems(urls) {
            const seen = new Map();
            for (let u of urls) {
                if (JUNK_REGEX.test(u)) continue;
                if (location.protocol === 'https:' && u.startsWith('http:')) u = 'https:' + u.slice(5);
                const key = u.split('?')[0];
                if (!seen.has(key)) seen.set(key, u);
            }
            return [...seen.values()].map(u => {
                const hlsType = /\.m3u8(\?|$)/i.test(u);
                return {
                    url: u,
                    hls: hlsType,
                    label: hlsType ? 'HLS (Stream)' : (u.split('?')[0].split('.').pop() || 'vídeo').toUpperCase()
                };
            });
        }

        function renderItems() {
            const c = $('linksContainer');
            c.textContent = '';
            items.forEach((item, i) => {
                const chip = document.createElement('div');
                chip.className = 'link-chip';
                chip.dataset.index = i;

                const info = document.createElement('div');
                info.className = 'link-info';
                const tag = document.createElement('span');
                tag.className = 'link-tag';
                tag.textContent = item.label;
                const urlSpan = document.createElement('span');
                urlSpan.className = 'link-url';
                urlSpan.textContent = item.url;
                urlSpan.title = item.url;
                info.append(tag, urlSpan);

                const actions = document.createElement('div');
                actions.className = 'link-actions';
                const play = document.createElement('button');
                play.textContent = 'Tocar';
                play.addEventListener('click', () => playIndex(i));
                const copy = document.createElement('button');
                copy.textContent = 'Copiar';
                copy.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(item.url);
                        copy.textContent = 'Copiado!';
                    } catch { copy.textContent = 'Falhou'; }
                    setTimeout(() => copy.textContent = 'Copiar', 1500);
                });
                actions.append(play, copy);

                chip.append(info, actions);
                c.appendChild(chip);
            });
        }

        function markActive() {
            document.querySelectorAll('.link-chip').forEach(ch =>
                ch.classList.toggle('active', Number(ch.dataset.index) === currentIndex));
        }

        function resetPlayer() {
            const player = $('videoPlayer');
            if (hls) { hls.destroy(); hls = null; }
            player.pause();
            player.removeAttribute('src');
            player.load();
        }

        function playIndex(i) {
            if (i < 0 || i >= items.length) return;
            currentIndex = i;
            markActive();
            const item = items[i];
            const player = $('videoPlayer');
            log(`Carregando (${item.label}): ${item.url}`);
            resetPlayer();

            if (item.hls && window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) log(`Erro HLS fatal: ${data.details}`);
                });
                hls.loadSource(item.url);
                hls.attachMedia(player);
            } else {
                player.src = item.url;
            }
            player.play().catch(() => {
                log('Aviso: reprodução automática bloqueada pelo navegador. Clique em play no vídeo.');
            });
        }

        function extrairEExecutar() {
            const htmlContent = $('htmlInput').value.trim();

            if (!htmlContent) {
                showMessage('Cole o código HTML no campo acima.', true);
                return;
            }

            items = [];
            currentIndex = -1;
            resetPlayer();
            showMessage('Analisando HTML...');
            log('Iniciando varredura avançada no código-fonte colado...');

            try {
                const { media } = scanHtml(htmlContent);
                items = buildItems(media);

                if (!items.length) {
                    log('Nenhum link de vídeo encontrado no código HTML informado.');
                    showMessage('Nenhum link detectado. Tente colar o código da página interna do player.', true);
                    return;
                }

                log(`Sucesso! ${items.length} link(s) encontrados.`);
                renderItems();
                playIndex(0);
            } catch (err) {
                log(`Erro ao processar HTML: ${err.message}`);
                showMessage('Falha ao processar o código-fonte.', true);
            }
        }

        $('extractBtn').addEventListener('click', extrairEExecutar);
    </script>
</body>
</html>
