<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i9tv - Extractor & Player Automático</title>
    <style>
        :root {
            --bg-color: #1E1E1E;
            --panel-bg: #2D2D2D;
            --accent-color: #00FFCC;
            --text-color: #E0E0E0;
            --border-color: #444;
            --danger-color: #FF5555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.4rem;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #151515;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #FFF;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            padding: 12px 22px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media(max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-box h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .links-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .link-chip {
            background: #222;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent-color);
            gap: 8px;
        }

        .link-chip.active { background: #1c3a34; }

        .link-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .link-tag { color: var(--accent-color); font-weight: bold; }
        .link-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #bbb; }
        .link-actions { display: flex; gap: 4px; }

        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }

        .link-chip button {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: #444;
            color: #FFF;
        }

        .log-box {
            white-space: pre-wrap;
            background: #111;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            max-height: 90px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .hint {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ i9tv - Extractor Automático & Player</h2>
        
        <div class="input-group">
            <input type="text" id="pageUrlInput" inputmode="url" autocomplete="off" placeholder="Cole a URL da página ou link direto do vídeo (.mp4/.m3u8)...">
            <button id="extractBtn">Extrair / Tocar</button>
        </div>
        <div class="hint">Dica: Se o site bloquear a extração automática por segurança, cole o link direto do arquivo de vídeo (.mp4 ou .m3u8) no campo acima.</div>

        <div class="workspace">
            <!-- Coluna da Esquerda: Links Detectados -->
            <div class="panel-box">
                <h3>Links Extraídos / Adicionados</h3>
                <div class="links-list" id="linksContainer">
                    <span style="color: #666; font-size: 0.85rem; text-align: center; margin-top: 20px;">Aguardando URL...</span>
                </div>
            </div>

            <!-- Coluna da Direita: Player Integrado -->
            <div class="panel-box">
                <h3>Player de Teste / Reprodução</h3>
                <div class="player-container">
                    <video id="videoPlayer" controls playsinline>
                        Seu navegador não suporta reprodução de vídeo.
                    </video>
                </div>
            </div>
        </div>

        <div class="log-box" id="logBox" aria-live="polite">&gt; Status do sistema: pronto.</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
    <script>
        const MAX_LOG = 50;
        const TIMEOUT_MS = 12000;
        const PROXIES = [
            u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
            u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
        ];

        const MEDIA_REGEX = /https?:\/\/[^"'\s<>\\]+?\.(?:mp4|m3u8|ts|m4s)(?:\?[^"'\s<>\\]*)?/gi;
        const JUNK_REGEX = /(thumb|preview|sprite|poster|trailer|[\/_.-]ads?[\/_.-])/i;

        const $ = id => document.getElementById(id);
        const logLines = [];
        let hls = null;
        let items = [];
        let currentIndex = -1;
        let busy = false;

        function log(msg) {
            logLines.push(msg);
            if (logLines.length > MAX_LOG) logLines.shift();
            const box = $('logBox');
            box.textContent = logLines.map(l => '> ' + l).join('\n');
            box.scrollTop = box.scrollHeight;
        }

        function setBusy(state) {
            busy = state;
            const btn = $('extractBtn');
            btn.disabled = state;
            btn.textContent = state ? 'Processando...' : 'Extrair / Tocar';
        }

        function showMessage(text, danger) {
            const c = $('linksContainer');
            c.textContent = '';
            const s = document.createElement('span');
            s.className = 'empty-msg';
            s.style.color = danger ? 'var(--danger-color)' : '#666';
            s.textContent = text;
            c.appendChild(s);
        }

        async function fetchHtml(url) {
            let lastErr = null;
            const direct = u => u;
            for (const build of [direct, ...PROXIES]) {
                const label = build === direct ? 'conexão direta' : 'proxy ' + new URL(build('https://x.com')).host;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
                    const res = await fetch(build(url), { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const text = await res.text();
                    if (!text || text.length < 20) throw new Error('resposta vazia');
                    return text;
                } catch (e) {
                    lastErr = e;
                    log(`${label} falhou (${e.name === 'AbortError' ? 'timeout' : e.message}).`);
                }
            }
            throw new Error(`Todos os métodos falharam. O site bloqueou o acesso automatizado.`);
        }

        function normalize(html) {
            return html
                .replace(/\\u002F/gi, '/')
                .replace(/\\u0026/gi, '&')
                .replace(/\\\//g, '/')
                .replace(/&amp;/g, '&');
        }

        function resolveUrl(raw, base) {
            try {
                const u = new URL(raw, base);
                return /^https?:$/.test(u.protocol) ? u.href : null;
            } catch { return null; }
        }

        function isMedia(u) { return /\.(mp4|webm|ogv|m3u8|m4s|ts)(\?|$)/i.test(u); }

        function scanHtml(html, baseUrl) {
            const clean = normalize(html);
            const media = new Set(clean.match(MEDIA_REGEX) || []);
            const doc = new DOMParser().parseFromString(clean, 'text/html');

            const add = raw => {
                const abs = raw && resolveUrl(raw, baseUrl);
                if (abs && isMedia(abs)) media.add(abs);
            };

            doc.querySelectorAll('meta[property="og:video"], meta[property="og:video:url"], meta[property="og:video:secure_url"], meta[name="twitter:player:stream"]')
                .forEach(m => add(m.getAttribute('content')));
            doc.querySelectorAll('video, source').forEach(el => {
                add(el.getAttribute('src'));
                add(el.getAttribute('data-src'));
            });
            return { media };
        }

        function buildItems(urls) {
            const seen = new Map();
            for (let u of urls) {
                if (JUNK_REGEX.test(u)) continue;
                if (location.protocol === 'https:' && u.startsWith('http:')) u = 'https:' + u.slice(5);
                const key = u.split('?')[0];
                if (!seen.has(key)) seen.set(key, u);
            }
            return [...seen.values()].map(u => {
                const hlsType = /\.m3u8(\?|$)/i.test(u);
                return {
                    url: u,
                    hls: hlsType,
                    quality: 0,
                    label: hlsType ? 'HLS (Stream)' : (u.split('?')[0].split('.').pop() || 'vídeo').toUpperCase()
                };
            });
        }

        function renderItems() {
            const c = $('linksContainer');
            c.textContent = '';
            items.forEach((item, i) => {
                const chip = document.createElement('div');
                chip.className = 'link-chip';
                chip.dataset.index = i;

                const info = document.createElement('div');
                info.className = 'link-info';
                const tag = document.createElement('span');
                tag.className = 'link-tag';
                tag.textContent = item.label;
                const urlSpan = document.createElement('span');
                urlSpan.className = 'link-url';
                urlSpan.textContent = item.url;
                urlSpan.title = item.url;
                info.append(tag, urlSpan);

                const actions = document.createElement('div');
                actions.className = 'link-actions';
                const play = document.createElement('button');
                play.textContent = 'Tocar';
                play.addEventListener('click', () => playIndex(i));
                const copy = document.createElement('button');
                copy.textContent = 'Copiar';
                copy.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(item.url);
                        copy.textContent = 'Copiado!';
                    } catch { copy.textContent = 'Falhou'; }
                    setTimeout(() => copy.textContent = 'Copiar', 1500);
                });
                actions.append(play, copy);

                chip.append(info, actions);
                c.appendChild(chip);
            });
        }

        function markActive() {
            document.querySelectorAll('.link-chip').forEach(ch =>
                ch.classList.toggle('active', Number(ch.dataset.index) === currentIndex));
        }

        function resetPlayer() {
            const player = $('videoPlayer');
            if (hls) { hls.destroy(); hls = null; }
            player.pause();
            player.removeAttribute('src');
            player.load();
        }

        function playIndex(i) {
            if (i < 0 || i >= items.length) return;
            currentIndex = i;
            markActive();
            const item = items[i];
            const player = $('videoPlayer');
            log(`Carregando (${item.label}): ${item.url}`);
            resetPlayer();

            if (item.hls && window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) {
                        log(`Erro HLS fatal: ${data.details}`);
                    }
                });
                hls.loadSource(item.url);
                hls.attachMedia(player);
            } else {
                player.src = item.url;
            }
            player.play().catch(() => {
                log('Aviso: reprodução automática bloqueada pelo navegador. Clique em play no vídeo.');
            });
        }

        async function extrairEExecutar() {
            if (busy) return;
            const raw = $('pageUrlInput').value.trim();
            if (!raw) {
                showMessage('Digite uma URL válida.', true);
                return;
            }

            // Se o usuário colou direto um link de vídeo (.mp4 ou .m3u8)
            if (isMedia(raw)) {
                items = [{ url: raw, hls: /\.m3u8/i.test(raw), label: 'DIRETO' }];
                renderItems();
                playIndex(0);
                log('Link de mídia direto adicionado com sucesso.');
                return;
            }

            let url;
            try {
                url = new URL(raw).href;
            } catch {
                showMessage('URL inválida. Verifique o endereço.', true);
                return;
            }

            setBusy(true);
            items = [];
            currentIndex = -1;
            resetPlayer();
            showMessage('Extraindo...');
            log(`Iniciando extração para: ${url}`);

            try {
                const html = await fetchHtml(url);
                log('Página obtida. Varrendo links...');

                const { media } = scanHtml(html, url);
                items = buildItems(media);

                if (!items.length) {
                    log('Nenhum link direto encontrado. O site oculta o vídeo.');
                    showMessage('Nenhum link detectado automaticamente. Cole o link .mp4/.m3u8 diretamente.', true);
                    return;
                }

                log(`Sucesso! ${items.length} link(s) encontrados.`);
                renderItems();
                playIndex(0);
            } catch (err) {
                log(`Erro: ${err.message}`);
                showMessage('Falha ao processar automaticamente. Cole o link direto do vídeo.', true);
            } finally {
                setBusy(false);
            }
        }

        $('extractBtn').addEventListener('click', extrairEExecutar);
        $('pageUrlInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') extrairEExecutar();
        });
    </script>
</body>
</html>
